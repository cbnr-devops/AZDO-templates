parameters:
  aksCluster: ''
  resourceGroup: ''
  acrName: ''
  imageName: ''
  tag: ''
  namespace: ''
  helmPath: ''
  wait: false
  atomic: false
  timeout: '5m'

steps:
  - task: AzureCLI@2
    inputs:
      azureSubscription: 'azure-connection'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        set -euo pipefail

        az aks get-credentials \
          --resource-group ${{ parameters.resourceGroup }} \
          --name ${{ parameters.aksCluster }} \
          --overwrite-existing

        helm upgrade --install ${{ parameters.imageName }}-${{ parameters.namespace }} ${{ parameters.helmPath }} \
          --set image.repository=${{ parameters.acrName }}.azurecr.io/${{ parameters.imageName }} \
          --set image.tag=${{ parameters.tag }} \
          -f ${{ parameters.helmPath }}/values-${{ parameters.namespace }}.yaml \
          --namespace ${{ parameters.namespace }} \
          --create-namespace \
          ${{ if eq(parameters.wait, true) }} --wait --timeout ${{ parameters.timeout }} ${{ end }} \
          ${{ if eq(parameters.atomic, true) }} --atomic ${{ end }}
    displayName: Deploy to ${{ parameters.aksCluster }}