parameters:
  imageName: ''
  tag: ''
  acrName: ''
  azureSubscription: 'azure-connection'

steps:
  - task: AzureCLI@2
    inputs:
      azureSubscription: ${{ parameters.azureSubscription }}
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        set -euo pipefail

        ACR_NAME="${{ parameters.acrName }}"
        ACR_LOGIN_SERVER="${ACR_NAME}.azurecr.io"
        IMAGE_NAME="${{ parameters.imageName }}"
        TAG="${{ parameters.tag }}"

        ACR_TOKEN="$(az acr login --name "$ACR_NAME" --expose-token --output tsv --query accessToken)"
        echo "$ACR_TOKEN" | docker login "$ACR_LOGIN_SERVER" \
          --username 00000000-0000-0000-0000-000000000000 \
          --password-stdin

        docker tag "$IMAGE_NAME:$TAG" \
          "$ACR_LOGIN_SERVER/$IMAGE_NAME:$TAG"

        docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:$TAG"

        docker tag "$IMAGE_NAME:$TAG" \
          "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest"

        docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest"

        docker rmi "$ACR_LOGIN_SERVER/$IMAGE_NAME:$TAG" || true
        docker rmi "$ACR_LOGIN_SERVER/$IMAGE_NAME:latest" || true
    displayName: Push to ACR
